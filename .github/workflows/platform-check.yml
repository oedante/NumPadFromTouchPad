name: platform-check
on:
  push:
    branches: ['avalonia']
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build platform libraries
        shell: pwsh
        run: |
          $fail = 0
          foreach ($p in 'NumPad.Platform','NumPad.Platform.Windows','NumPad.Platform.Linux','NumPad.Platform.MacOS') {
            dotnet build src/$p/$p.csproj -c Release 2>&1 | Tee-Object -FilePath "build-$p.log"
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
            Select-String -Path "build-$p.log" -Pattern '(error|warning) [A-Z]+[0-9]+' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 30 | ForEach-Object { Write-Host "::warning title=$p::$_" }
          }
          exit $fail
      - name: Tests
        shell: pwsh
        run: |
          dotnet test tests/NumPad.Core.Tests/NumPad.Core.Tests.csproj -c Release --logger "trx;LogFileName=t.trx" --results-directory TR 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if (Test-Path TR/t.trx) { [xml]$x = Get-Content TR/t.trx; $c = $x.TestRun.ResultSummary.Counters; Write-Host "::notice title=Tests ${{ matrix.os }}::total=$($c.total) passed=$($c.passed) failed=$($c.failed)" }
          Select-String -Path test.log -Pattern '(error [A-Z]+[0-9]+|\[FAIL\]|Assert\.)' | Select-Object -First 30 | ForEach-Object { Write-Host "::warning title=test::$($_.Line.Trim())" }
          exit $code
