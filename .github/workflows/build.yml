name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Создать pre-release с этим тегом (пусто — без релиза)'
        required: false
        default: ''

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rids: win-x64 win-arm64
            smoke: win-x64
          - os: ubuntu-latest
            rids: linux-x64 linux-arm64
            smoke: linux-x64
          - os: macos-latest
            rids: osx-arm64 osx-x64
            smoke: osx-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # снимки интерфейса публикуются в ветки screenshots-<ОС>
      id-token: write   # вход в Azure по OIDC для подписи Windows (используется, только если подпись настроена)
    env:
      # Подпись включается сама, когда в репозитории заданы секреты/переменные (см. DISTRIBUTION.md),
      # и только для ветки main (релизы запускаются из неё): федеративные учётные данные Azure выдаются на main,
      # а нотаризация занимает минуты — на рабочих ветках она не нужна.
      WIN_SIGN: ${{ vars.AZURE_SIGNING_ACCOUNT != '' && github.ref == 'refs/heads/main' }}
      MAC_SIGN: ${{ secrets.MACOS_CERT_P12 != '' && github.ref == 'refs/heads/main' }}
      MAC_NOTARIZE: ${{ secrets.MACOS_CERT_P12 != '' && (secrets.AC_PASSWORD != '' || secrets.AC_API_KEY_P8 != '') && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build (warnings reported as annotations)
        shell: pwsh
        run: |
          dotnet build OgnelissNumTouch.sln -c Release 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          $w = Select-String -Path build.log -Pattern '(error|warning) [A-Z]+[0-9]+' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
          Write-Host "::notice title=Build ${{ matrix.os }}::exit=$code, diagnostics: $($w.Count)"
          $w | Select-Object -First 50 | ForEach-Object { Write-Host "::warning title=Compiler ${{ matrix.os }}::$_" }
          exit $code

      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/Ogneliss.NumTouch.Tests/Ogneliss.NumTouch.Tests.csproj -c Release --no-build --logger "trx;LogFileName=t.trx" --results-directory TR 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if (Test-Path TR/t.trx) { [xml]$x = Get-Content TR/t.trx; $c = $x.TestRun.ResultSummary.Counters; Write-Host "::notice title=Tests ${{ matrix.os }}::total=$($c.total) passed=$($c.passed) failed=$($c.failed)" }
          Select-String -Path test.log -Pattern '\[FAIL\]' | Select-Object -First 30 | ForEach-Object { Write-Host "::warning title=Failed test::$($_.Line.Trim())" }
          exit $code

      - name: Publish
        shell: pwsh
        run: |
          foreach ($rid in "${{ matrix.rids }}".Split(' ')) {
            dotnet publish src/Ogneliss.NumTouch.App/Ogneliss.NumTouch.App.csproj -p:PublishProfile=$rid
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install Xvfb (Linux UI self-test)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: UI self-test (main window + all pages)
        shell: pwsh
        env:
          NUMTOUCH_SELFTEST_RESULT: ${{ github.workspace }}/selftest-result.txt
          NUMTOUCH_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: |
          $dir = "artifacts/${{ matrix.smoke }}"
          $exe = if ($IsWindows) { "$dir/OgnelissNumTouch.exe" } else { "$dir/OgnelissNumTouch" }
          if ($IsLinux) {
            $p = Start-Process xvfb-run -ArgumentList "-a", $exe, "--selftest" -PassThru
          } else {
            $p = Start-Process $exe -ArgumentList "--selftest" -PassThru
          }
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; Write-Host "::error title=Self-test::timeout"; exit 1 }
          $text = if (Test-Path $env:NUMTOUCH_SELFTEST_RESULT) { Get-Content $env:NUMTOUCH_SELFTEST_RESULT -Raw } else { "no result file" }
          Write-Host "::notice title=Self-test ${{ matrix.os }} (exit $($p.ExitCode))::$($text -replace "`r?`n", ' / ')"
          $roots = @($env:APPDATA, "$HOME/.config", "$HOME/Library/Application Support") | Where-Object { $_ -and (Test-Path $_) }
          $log = $roots | ForEach-Object { Get-ChildItem -Recurse -Filter numtouch.log -Path $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          if ($log) { Get-Content $log.FullName | Select-Object -Last 25 | ForEach-Object { Write-Host "::notice title=App log ${{ matrix.os }}::$_" } }
          if ($p.ExitCode -ne 0 -or -not $text.StartsWith("OK")) { exit 1 }

      # Снимки всех страниц (оба языка, светлая и тёмная тема) — в ветку screenshots-<ОС>
      # для проверки вёрстки на каждой системе без скачивания артефактов.
      - name: Publish UI screenshots
        if: hashFiles('screenshots/*.png') != ''
        shell: bash
        run: |
          cd screenshots
          echo "${{ github.sha }} ${{ github.ref_name }}" > SOURCE.txt
          branch="screenshots-$(echo '${{ runner.os }}' | tr '[:upper:]' '[:lower:]')"
          git init -q && git checkout -q -b "$branch" && git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "UI screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$branch"
          echo "::notice title=Screenshots::$(ls *.png | wc -l) PNG -> branch $branch"

      # ---------------------------------------------------------------- Windows: подпись (Azure Artifact Signing)
      - name: Azure login (OIDC)
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executables
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows signature
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($rid in "${{ matrix.rids }}".Split(' ')) {
            $sig = Get-AuthenticodeSignature "artifacts/$rid/OgnelissNumTouch.exe"
            Write-Host "::notice title=Signature $rid::$($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { exit 1 }
          }

      # ---------------------------------------------------------------- Windows: пакет MSIX для Microsoft Store
      - name: Build MSIX (Microsoft Store)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $a = @{}
          if ($env:MSIX_IDENTITY_NAME) { $a.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $a.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $a.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          foreach ($rid in "${{ matrix.rids }}".Split(' ')) { ./packaging/windows/make-msix.ps1 -Rid $rid @a }
          New-Item -ItemType Directory -Force store | Out-Null
          Move-Item dist/*.msix store/
          $note = if ($env:MSIX_PUBLISHER) { "identity from repository variables" } else { "placeholder identity — set MSIX_* variables before uploading to the Store" }
          Write-Host "::notice title=MSIX::$((Get-ChildItem store).Name -join ', ') ($note)"

      # ---------------------------------------------------------------- macOS: сертификат Developer ID
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.MAC_SIGN == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(uuidgen)"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc"

      - name: Package
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ github.ref == 'refs/heads/main' && secrets.MACOS_SIGN_IDENTITY || '' }}
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          mkdir -p dist
          if [ -n "$AC_API_KEY_P8" ]; then
            export AC_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"; printf '%s' "$AC_API_KEY_P8" > "$AC_API_KEY_PATH"
          fi
          for rid in ${{ matrix.rids }}; do
            case "$rid" in
              win-*) cp "artifacts/$rid/OgnelissNumTouch.exe" "dist/OgnelissNumTouch-$rid.exe" ;;
              linux-*)
                d="dist/OgnelissNumTouch-$rid"; mkdir -p "$d"
                cp "artifacts/$rid/OgnelissNumTouch" packaging/linux/* "$d/"
                tar -C dist -czf "dist/OgnelissNumTouch-$rid.tar.gz" "OgnelissNumTouch-$rid"; rm -rf "$d" ;;
              osx-*)
                bash packaging/macos/make-app.sh "$rid"
                echo "::notice title=App bundle $rid::$(cd "artifacts/OgnelissNumTouch-$rid.app/Contents/MacOS" && file * | sed 's/,.*//' | tr '\n' ';')"
                if [ "$MAC_NOTARIZE" = "true" ]; then bash packaging/macos/notarize.sh "$rid"; fi
                cp "artifacts/OgnelissNumTouch-$rid.zip" dist/ ;;
            esac
          done
          ls -la dist
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist/*

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: store-msix
          path: store/*

  release:
    needs: build
    if: github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Описание релиза — только раздел последней версии из CHANGELOG.md.
          awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md
          gh release create "${{ github.event.inputs.release_tag }}" dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Ogneliss NumTouch ${{ github.event.inputs.release_tag }}" --notes-file release-notes.md
