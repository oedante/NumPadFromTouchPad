name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Создать pre-release с этим тегом (пусто — без релиза)'
        required: false
        default: ''

jobs:
  core-tests-linux:
    # Общая логика не зависит от Windows — тесты гоняются и на Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/NumPad.Core.Tests/NumPad.Core.Tests.csproj -c Release --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: TestResults

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (warnings reported as annotations)
        shell: pwsh
        run: |
          dotnet build NumPadFromTouchPad.sln -c Release --no-incremental 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $w = Select-String -Path build.log -Pattern 'warning [A-Z]+[0-9]+' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
          Write-Host "::notice title=Build::Warnings: $($w.Count)"
          $w | Select-Object -First 40 | ForEach-Object { Write-Host "::warning title=Compiler::$_" }
      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/NumPad.Core.Tests/NumPad.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults
          $code = $LASTEXITCODE
          [xml]$trx = Get-Content TestResults/core-tests.trx
          $c = $trx.TestRun.ResultSummary.Counters
          Write-Host "::notice title=Tests::total=$($c.total) passed=$($c.passed) failed=$($c.failed) skipped=$($c.notExecuted)"
          exit $code
      - name: Publish win-x64 (self-contained single file)
        run: dotnet publish src/NumPad.App/NumPad.App.csproj -p:PublishProfile=win-x64
      - name: Publish win-arm64
        run: dotnet publish src/NumPad.App/NumPad.App.csproj -p:PublishProfile=win-arm64
      - name: Smoke start (process starts and stays alive 5 s)
        shell: pwsh
        run: |
          $exe = "artifacts/win-x64/NumPadFromTouchPad.exe"
          $p = Start-Process $exe -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { Write-Error "Process exited with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          $log = Join-Path $env:APPDATA "NumPadFromTouchPad/logs/numpad.log"
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host "::notice title=App log::$_" } }
      - name: UI self-test (main window + all pages)
        shell: pwsh
        run: |
          $p = Start-Process "artifacts/win-x64/NumPadFromTouchPad.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; Write-Error "Self-test timed out"; exit 1 }
          $res = Join-Path $env:APPDATA "NumPadFromTouchPad/selftest-result.txt"
          $text = if (Test-Path $res) { Get-Content $res -Raw } else { "no result file" }
          Write-Host "::notice title=Self-test (exit $($p.ExitCode))::$($text -replace "`r?`n", ' / ')"
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: NumPadFromTouchPad-win-x64
          path: artifacts/win-x64/NumPadFromTouchPad.exe
      - uses: actions/upload-artifact@v4
        with:
          name: NumPadFromTouchPad-win-arm64
          path: artifacts/win-arm64/NumPadFromTouchPad.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults
      - name: GitHub Release (tags v* or manual run with release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item artifacts/win-x64/NumPadFromTouchPad.exe NumPadFromTouchPad-win-x64.exe
          Copy-Item artifacts/win-arm64/NumPadFromTouchPad.exe NumPadFromTouchPad-win-arm64.exe
          $tag = if ("${{ github.event.inputs.release_tag }}") { "${{ github.event.inputs.release_tag }}" } else { "${{ github.ref_name }}" }
          gh release create $tag NumPadFromTouchPad-win-x64.exe NumPadFromTouchPad-win-arm64.exe --target $env:GITHUB_SHA --prerelease --title "NumPad from TouchPad $tag" --notes-file CHANGELOG.md
